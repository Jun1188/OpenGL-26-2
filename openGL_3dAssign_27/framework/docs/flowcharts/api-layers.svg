<svg viewBox="0 0 1200 920" role="img" aria-label="04 엔티티 계층·모션 연결·변환·GPU 바인딩"><title>04 엔티티 계층·모션 연결·변환·GPU 바인딩</title><defs><marker id="api-layers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#4d688a"/></marker></defs><path d="M275 98 V170" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#api-layers-arrow)"/><text x="290" y="143" font-size="16" fill="#263f5e">부모 변환</text><path d="M925 98 V170" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#api-layers-arrow)"/><text x="940" y="143" font-size="16" fill="#263f5e">레이어 합성</text><path d="M665 209 H535" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#api-layers-arrow)"/><text x="545" y="197" font-size="16" fill="#263f5e">ID 연결을 읽음</text><path d="M275 248 V285 H600 V330" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#api-layers-arrow)"/><path d="M925 248 V285 H600" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#api-layers-arrow)"/><path d="M600 408 V480" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#api-layers-arrow)"/><text x="615" y="453" font-size="16" fill="#263f5e">면별 정책</text><path d="M600 558 V630" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#api-layers-arrow)"/><text x="615" y="601" font-size="16" fill="#263f5e">최종 M</text><path d="M600 708 V780" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#api-layers-arrow)"/><text x="615" y="751" font-size="16" fill="#263f5e">명령 제출</text><rect x="15" y="20" width="520" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="275.0" y="53.5" text-anchor="middle" font-size="17" fill="#1d2c40">Scene::setParent → Component_Poly.parent</text><text x="275.0" y="76.5" text-anchor="middle" font-size="17" fill="#1d2c40">루트 → 조상 → 대상; C++ 상속과 별개</text><rect x="665" y="20" width="520" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="925.0" y="53.5" text-anchor="middle" font-size="17" fill="#1d2c40">MotionSystem: LayerId 부모 체인</text><text x="925.0" y="76.5" text-anchor="middle" font-size="17" fill="#1d2c40">bindMotion: 레이어 ↔ MotionId</text><rect x="15" y="170" width="520" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="275.0" y="203.5" text-anchor="middle" font-size="17" fill="#1d2c40">Scene::bindEntity → entityLayers_</text><text x="275.0" y="226.5" text-anchor="middle" font-size="17" fill="#1d2c40">가장 가까운 조상 연결 지점(anchor) 선택</text><rect x="665" y="170" width="520" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="925.0" y="203.5" text-anchor="middle" font-size="17" fill="#1d2c40">layerMatrices(leaf)</text><text x="925.0" y="226.5" text-anchor="middle" font-size="17" fill="#1d2c40">TransformSpace에 따라 parent / local 합성</text><rect x="100" y="330" width="1000" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="600.0" y="363.5" text-anchor="middle" font-size="17" fill="#1d2c40">worldMatrix = motion.parent × prefix × motion.local × suffix</text><text x="600.0" y="386.5" text-anchor="middle" font-size="17" fill="#1d2c40">prefix: 루트~anchor; suffix: anchor 다음~대상; L = T(basis)·R·S·T(-pivot)</text><rect x="100" y="480" width="1000" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="600.0" y="513.5" text-anchor="middle" font-size="17" fill="#1d2c40">faceWorldMatrix = world × transformFrame × faceLocalMatrix</text><text x="600.0" y="536.5" text-anchor="middle" font-size="17" fill="#1d2c40">Hierarchy면 worldMatrix; Independent면 I / 면 애니메이션은 Local·Model 순서 구분</text><rect x="100" y="630" width="1000" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="600.0" y="663.5" text-anchor="middle" font-size="17" fill="#1d2c40">Renderer::renderPass → draw: model=M, view=V, projection=P</text><text x="600.0" y="686.5" text-anchor="middle" font-size="17" fill="#1d2c40">GPU 바인딩: UseProgram + BindVertexArray + texture + Uniform(MVP=P·V·M)</text><rect x="100" y="780" width="1000" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="600.0" y="813.5" text-anchor="middle" font-size="17" fill="#1d2c40">DrawElements: EBO 인덱스 → 정점 셰이더 gl_Position</text><text x="600.0" y="836.5" text-anchor="middle" font-size="17" fill="#1d2c40">클리핑 → 원근 나눗셈 → viewport → 래스터화 → 프래그먼트 → 깊이/프레임버퍼</text></svg>
