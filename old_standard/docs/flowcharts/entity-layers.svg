<svg xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, sans-serif" viewBox="0 0 1100 640" role="img" aria-label="엔티티 계층과 모션 레이어: 연결 위치와 행렬 전달"><title>엔티티 계층과 모션 레이어: 연결 위치와 행렬 전달</title><defs><marker id="standalone-hierarchy-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#4d688a"/></marker></defs><path d="M195 85 V150" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#standalone-hierarchy-arrow)"/><text x="205" y="125" font-size="16" fill="#263f5e">부모 → 자식</text><path d="M195 85 V115 H485 V150" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#standalone-hierarchy-arrow)"/><text x="385" y="106" font-size="16" fill="#263f5e">분기</text><path d="M195 215 V280" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#standalone-hierarchy-arrow)"/><path d="M195 345 V410" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#standalone-hierarchy-arrow)"/><path d="M195 475 V540" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#standalone-hierarchy-arrow)"/><text x="205" y="513" font-size="16" fill="#263f5e">면 변환</text><path d="M870 85 V150" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#standalone-hierarchy-arrow)"/><text x="880" y="125" font-size="16" fill="#263f5e">레이어 부모</text><path d="M870 215 V280" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#standalone-hierarchy-arrow)"/><path d="M710 312 H330" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#standalone-hierarchy-arrow)"/><text x="365" y="298" font-size="16" fill="#263f5e">bindEntity: 부모 관계와 별개</text><path d="M870 345 V410" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#standalone-hierarchy-arrow)"/><text x="878" y="381" font-size="16" fill="#263f5e">World / Local 합성</text><path d="M870 475 V540" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#standalone-hierarchy-arrow)"/><rect x="60" y="20" width="270" height="65" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="195.0" y="58.5" text-anchor="middle" font-size="17" fill="#1d2c40">엔티티 루트 L0</text><rect x="60" y="150" width="270" height="65" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="195.0" y="188.5" text-anchor="middle" font-size="17" fill="#1d2c40">조상 L1: prefix에 포함</text><rect x="360" y="150" width="250" height="65" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="485.0" y="177.0" text-anchor="middle" font-size="17" fill="#1d2c40">다른 자식</text><text x="485.0" y="200.0" text-anchor="middle" font-size="17" fill="#1d2c40">대상 체인에는 미포함</text><rect x="60" y="280" width="270" height="65" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="195.0" y="318.5" text-anchor="middle" font-size="17" fill="#1d2c40">연결 엔티티 La: anchor</text><rect x="60" y="410" width="270" height="65" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="195.0" y="448.5" text-anchor="middle" font-size="17" fill="#1d2c40">자손 Lt: suffix에 포함</text><rect x="60" y="540" width="270" height="65" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="195.0" y="578.5" text-anchor="middle" font-size="17" fill="#1d2c40">대상 면: faceChild × F</text><rect x="710" y="20" width="320" height="65" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="870.0" y="58.5" text-anchor="middle" font-size="17" fill="#1d2c40">모션 rootLayer</text><rect x="710" y="150" width="320" height="65" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="870.0" y="188.5" text-anchor="middle" font-size="17" fill="#1d2c40">상위 모션 레이어</text><rect x="710" y="280" width="320" height="65" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="870.0" y="318.5" text-anchor="middle" font-size="17" fill="#1d2c40">연결할 말단 LayerId</text><rect x="690" y="410" width="360" height="65" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="870.0" y="437.0" text-anchor="middle" font-size="17" fill="#1d2c40">layerMatrices 결과</text><text x="870.0" y="460.0" text-anchor="middle" font-size="17" fill="#1d2c40">motion.parent / motion.local</text><rect x="390" y="540" width="660" height="65" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="720.0" y="567.0" text-anchor="middle" font-size="17" fill="#1d2c40">entityWorld = parent × prefix × local × suffix</text><text x="720.0" y="590.0" text-anchor="middle" font-size="17" fill="#1d2c40">Mface = entityWorld × faceChild × F</text></svg>
