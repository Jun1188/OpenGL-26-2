<svg viewBox="0 0 1200 1130" role="img" aria-label="종합: main에서 GPU까지, 다음 프레임과 종료까지"><title>종합: main에서 GPU까지, 다음 프레임과 종료까지</title><defs><marker id="api-summary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#4d688a"/></marker></defs><path d="M600 98 V160" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#api-summary-arrow)"/><text x="615" y="135" font-size="16" fill="#263f5e">1 소유</text><path d="M600 238 V300" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#api-summary-arrow)"/><text x="615" y="275" font-size="16" fill="#263f5e">2 호출</text><path d="M600 378 V440" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#api-summary-arrow)"/><text x="615" y="415" font-size="16" fill="#263f5e">3 지역 값</text><path d="M600 518 V580" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#api-summary-arrow)"/><path d="M600 658 V720" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#api-summary-arrow)"/><text x="615" y="695" font-size="16" fill="#263f5e">4 변환·연결</text><path d="M600 798 V860" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#api-summary-arrow)"/><text x="615" y="835" font-size="16" fill="#263f5e">GPU 제출</text><path d="M600 938 V1000" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#api-summary-arrow)"/><text x="615" y="975" font-size="16" fill="#263f5e">표시</text><path d="M350 1039 H220 V339 H350" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#api-summary-arrow)"/><text x="230" y="696" font-size="16" fill="#263f5e">반복</text><path d="M850 1039 H890" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#api-summary-arrow)"/><text x="851" y="1025" font-size="16" fill="#263f5e">종료</text><rect x="350" y="20" width="500" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="600.0" y="53.5" text-anchor="middle" font-size="17" fill="#1d2c40">main: app·sample 지역 생성 → 콜백 등록</text><text x="600.0" y="76.5" text-anchor="middle" font-size="17" fill="#1d2c40">app이 Scene·Camera·Renderer를 소유</text><rect x="350" y="160" width="500" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="600.0" y="193.5" text-anchor="middle" font-size="17" fill="#1d2c40">run 초기화 → initScene</text><text x="600.0" y="216.5" text-anchor="middle" font-size="17" fill="#1d2c40">CPU 형상·계층·모션·ID 구성</text><rect x="350" y="300" width="500" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="600.0" y="333.5" text-anchor="middle" font-size="17" fill="#1d2c40">프레임: PollEvents → 입력 → dt 갱신</text><text x="600.0" y="356.5" text-anchor="middle" font-size="17" fill="#1d2c40">Console::onUpdate → Scene::updateMotions</text><rect x="350" y="440" width="500" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="600.0" y="473.5" text-anchor="middle" font-size="17" fill="#1d2c40">onRender → renderScene / renderViews</text><text x="600.0" y="496.5" text-anchor="middle" font-size="17" fill="#1d2c40">지역 RenderPass → Renderer::renderPass</text><rect x="350" y="580" width="500" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="600.0" y="613.5" text-anchor="middle" font-size="17" fill="#1d2c40">CPU: 필요 시 upload → draw</text><text x="600.0" y="636.5" text-anchor="middle" font-size="17" fill="#1d2c40">엔티티 부모 + 모션 레이어 + 면 변환 → M</text><rect x="350" y="720" width="500" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="600.0" y="753.5" text-anchor="middle" font-size="17" fill="#1d2c40">바인딩: program·VAO·texture·uniform</text><text x="600.0" y="776.5" text-anchor="middle" font-size="17" fill="#1d2c40">MVP=P·V·M → DrawElements</text><rect x="350" y="860" width="500" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="600.0" y="893.5" text-anchor="middle" font-size="17" fill="#1d2c40">GPU: vertex → fragment → framebuffer</text><text x="600.0" y="916.5" text-anchor="middle" font-size="17" fill="#1d2c40">CPU GL 호출 복귀와 GPU 완료는 별개</text><rect x="350" y="1000" width="500" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="600.0" y="1033.5" text-anchor="middle" font-size="17" fill="#1d2c40">렌더 성공: SwapBuffers → 다음 프레임</text><text x="600.0" y="1056.5" text-anchor="middle" font-size="17" fill="#1d2c40">종료·실패: Renderer 정리 → 창·GLFW 해제</text><rect x="890" y="1000" width="300" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="1040.0" y="1033.5" text-anchor="middle" font-size="17" fill="#1d2c40">run 반환 → main 반환</text><text x="1040.0" y="1056.5" text-anchor="middle" font-size="17" fill="#1d2c40">sample → app 소멸</text></svg>
