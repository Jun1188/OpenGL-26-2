="600.0" y="53.5" text-anchor="middle" font-size="17" fill="#1d2c40">main 스코프</text><text x="600.0" y="76.5" text-anchor="middle" font-size="17" fill="#1d2c40">Application app; Console sample(app)</text><rect x="40" y="160" width="360" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="220.0" y="193.5" text-anchor="middle" font-size="17" fill="#1d2c40">Application</text><text x="220.0" y="216.5" text-anchor="middle" font-size="17" fill="#1d2c40">값 멤버와 창·GLFW 수명 소유</text><rect x="800" y="160" width="360" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="980.0" y="193.5" text-anchor="middle" font-size="17" fill="#1d2c40">Console</text><text x="980.0" y="216.5" text-anchor="middle" font-size="17" fill="#1d2c40">app_은 Application&amp; 비소유 참조</text><rect x="10" y="330" width="275" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="147.5" y="363.5" text-anchor="middle" font-size="17" fill="#1d2c40">Scene</text><text x="147.5" y="386.5" text-anchor="middle" font-size="17" fill="#1d2c40">CPU 컴포넌트·MotionSystem 소유</text><rect x="310" y="330" width="275" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="447.5" y="363.5" text-anchor="middle" font-size="17" fill="#1d2c40">Camera / RenderOptions</text><text x="447.5" y="386.5" text-anchor="middle" font-size="17" fill="#1d2c40">Application의 값 멤버</text><rect x="610" y="330" width="275" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="747.5" y="363.5" text-anchor="middle" font-size="17" fill="#1d2c40">Renderer</text><text x="747.5" y="386.5" text-anchor="middle" font-size="17" fill="#1d2c40">GL 핸들·업로드 캐시 소유</text><rect x="910" y="330" width="275" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="1047.5" y="363.5" text-anchor="middle" font-size="17" fill="#1d2c40">optional&lt;AssetLoader&gt;</text><text x="1047.5" y="386.5" text-anchor="middle" font-size="17" fill="#1d2c40">Application 안에 emplace / reset</text><rect x="10" y="500" width="540" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="280.0" y="533.5" text-anchor="middle" font-size="17" fill="#1d2c40">Component_Poly → Polyhedron → Mesh</text><text x="280.0" y="556.5" text-anchor="middle" font-size="17" fill="#1d2c40">vector 값 소유; EntityId는 조회 번호</text><rect x="610" y="500" width="575" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="897.5" y="533.5" text-anchor="middle" font-size="17" fill="#1d2c40">program / VAO / VBO / EBO / texture</text><text x="897.5" y="556.5" text-anchor="middle" font-size="17" fill="#1d2c40">Renderer가 생성·삭제; GL 컨텍스트 필요</text><rect x="100" y="665" width="1000" height="78" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="600.0" y="698.5" text-anchor="middle" font-size="17" fill="#1d2c40">Material.texture: shared_ptr&lt;const TextureImage&gt;로 CPU 이미지 공유</text><text x="600.0" y="721.5" text-anchor="middle" font-size="17" fill="#1d2c40">이 핵심 타입 간 C++ 상속 선언은 없음; setParent는 장면 변환 관계</text></svg>
