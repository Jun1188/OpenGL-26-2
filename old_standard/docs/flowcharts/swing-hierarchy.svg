<svg xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, sans-serif" viewBox="0 0 1100 790" role="img" aria-label="그네·착석 사람: 부모에서 자식으로 전달되는 변환"><title>그네·착석 사람: 부모에서 자식으로 전달되는 변환</title><defs><marker id="standalone-swing-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#4d688a"/></marker></defs><path d="M560 85 V115 H175 V150" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#standalone-swing-arrow)"/><path d="M560 85 V150" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#standalone-swing-arrow)"/><path d="M560 215 V245 H175 V280" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#standalone-swing-arrow)"/><path d="M560 215 V280" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#standalone-swing-arrow)"/><path d="M560 345 V410" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#standalone-swing-arrow)"/><text x="573" y="385" font-size="16" fill="#263f5e">부모 변환 전달</text><path d="M560 475 V540" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#standalone-swing-arrow)"/><path d="M560 605 V640 H265 V680" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#standalone-swing-arrow)"/><path d="M560 605 V640 H845 V680" fill="none" stroke="#4d688a" stroke-width="2" marker-end="url(#standalone-swing-arrow)"/><rect x="410" y="20" width="300" height="65" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="560.0" y="58.5" text-anchor="middle" font-size="17" fill="#1d2c40">frame: 고정 기준</text><rect x="40" y="150" width="270" height="65" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="175.0" y="177.0" text-anchor="middle" font-size="17" fill="#1d2c40">고정 지지대</text><text x="175.0" y="200.0" text-anchor="middle" font-size="17" fill="#1d2c40">hinge의 형제가 됨</text><rect x="410" y="150" width="300" height="65" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="560.0" y="188.5" text-anchor="middle" font-size="17" fill="#1d2c40">hinge: 진자 회전</text><rect x="40" y="280" width="270" height="65" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="175.0" y="318.5" text-anchor="middle" font-size="17" fill="#1d2c40">줄: hinge를 따라감</text><rect x="410" y="280" width="300" height="65" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="560.0" y="318.5" text-anchor="middle" font-size="17" fill="#1d2c40">seat: hinge를 따라감</text><rect x="410" y="410" width="300" height="65" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="560.0" y="448.5" text-anchor="middle" font-size="17" fill="#1d2c40">person.root: 좌석의 자식</text><rect x="410" y="540" width="300" height="65" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="560.0" y="578.5" text-anchor="middle" font-size="17" fill="#1d2c40">pelvis: 골반 기준</text><rect x="100" y="680" width="330" height="65" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="265.0" y="707.0" text-anchor="middle" font-size="17" fill="#1d2c40">torso → 목·머리·어깨·팔</text><text x="265.0" y="730.0" text-anchor="middle" font-size="17" fill="#1d2c40">상체 편집은 이 하위로 전달</text><rect x="680" y="680" width="330" height="65" rx="10" fill="#e8f0fb" stroke="#6a8ebc"/><text x="845.0" y="707.0" text-anchor="middle" font-size="17" fill="#1d2c40">양쪽 hips → 무릎·발</text><text x="845.0" y="730.0" text-anchor="middle" font-size="17" fill="#1d2c40">하체는 골반 아래에서 분기</text></svg>
